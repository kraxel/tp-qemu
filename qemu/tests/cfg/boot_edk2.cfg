- boot_edk2: install setup image_copy unattended_install.cdrom
    only ovmf
    virt_test_type = qemu
    type = boot
    serial_login = no
    restart_vm = yes
    kill_vm_on_error = yes
    login_timeout = 240
    variants:
      - smm:
          only q35
          ovmf_code_filename = OVMF_CODE.secboot.fd
          variants:
            - secboot:
                ovmf_vars_filename = OVMF_VARS.secboot.fd
            - nosb:
                ovmf_vars_filename = OVMF_VARS.fd
      - nosmm:
          ovmf_code_filename = OVMF_CODE.fd
          ovmf_vars_filename = OVMF_VARS.fd
      - qemuvars:
          only Host_RHEL.m10
          bios_path = /usr/share/edk2/ovmf/OVMF.qemuvars.fd
          extra_params = " -device uefi-vars-x64"
